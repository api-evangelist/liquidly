aid: liquidly
name: Liquidly
description: 'Liquidly (Liquidly, Inc.) is a New York based financial technology company
  building infrastructure for illiquid assets — a permission-based secondary marketplace
  that lets holders of private fund interests transact without disrupting the fund.
  The platform serves three sides: fund managers, who get a streamlined and centrally
  supervised transfer process, market data, and the flexibility to structure longer
  lock-up vehicles; seller investors, who get a manager-approved selling process,
  access to a network of prospective buyers, and standardized commercial terms; and
  buyer investors, who get manager-granted asset permissions, standardized diligence
  materials, and technology-enabled execution. Liquidly targets the secondary market
  for the roughly $13.1 trillion invested in private funds across buyouts, venture
  capital, real estate, private debt, infrastructure, and growth. Broker-dealer services
  are offered through Liquidly IAS, LLC, registered with FINRA and a member of SIPC.
  Liquidly is backed by Anthemis, Portage Ventures, Village Global, and AmTrust Financial.
  As of this enrichment pass Liquidly publishes no public API, developer portal, SDKs,
  or technical documentation; the product is reached through an authenticated web
  application.'
